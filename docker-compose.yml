services:
  db:
    image: mysql:8.0
    container_name: smartbodycomposition-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: smartbodycomposition
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: smartbodycomposition-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: smartbodycomposition
      DB_USERNAME: root
      DB_PASSWORD: "secret"
      APP_URL: "http://localhost:8080"
      VITE_APP_URL: "http://localhost:8080"
      VITE_ASSET_URL: "http://localhost:8080"
      APP_ENV: local
      APP_DEBUG: "true"
      SESSION_DOMAIN: null
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
